name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24.0.0', '24', '26']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'pytest>=9,<10'
      - run: npm test
      - run: npm run test:pytest
      - run: npm run test:integration
      - run: npm run demo
      - run: npm run demo:repair
      - name: Verify the repair limit
        run: |
          result=$(mktemp)
          status=0
          npm run --silent demo:repair -- --show-stop > "$result" || status=$?
          test "$status" -eq 1
          jq -e '.status == "repair_limit" and (.consultation.attempts | length) == 2' "$result"
      - name: Verify the diagnosis path
        run: |
          npm run --silent demo:repair -- --show-diagnosis > diagnosis.json
          jq -e '.status == "passed" and .diagnosis.action == "repair" and [.attempts[].number] == [1, 2, 3]' diagnosis.json
      - name: Verify the save-and-reload example
        run: |
          workflow=examples/save-and-reload/workflow.test.mjs
          npm run --silent check:node -- --id storage examples/save-and-reload/storage.test.mjs
          status=0
          TFL_DEMO_MISWIRED=1 npm run --silent check:node -- --json --id before "$workflow" > before.json || status=$?
          test "$status" -eq 1
          jq -e '.observation.outcome == "failure" and (.evidence | length) == 2' before.json
          npm run --silent check:node -- --json --id after --resolves before "$workflow" | jq -e '.observation.outcome == "success" and .observation.resolves == "before"'
          status=0
          npm run --silent check:node -- --json --id unavailable examples/save-and-reload/missing.test.mjs > unavailable.json || status=$?
          test "$status" -eq 2
          jq -e '.observation.outcome == "unknown"' unavailable.json
